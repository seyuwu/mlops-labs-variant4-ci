apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: {{ .Release.Namespace }}
data:
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "lesson-files"
  REDIS_URL: "redis://redis:6379/0"
  LAB_ENABLE_BENCHMARK: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://platform:local-lab-password@postgres:5432/platform"
  POSTGRES_PASSWORD: "local-lab-password"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
