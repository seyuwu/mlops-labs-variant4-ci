apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  namespace: lab4
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-api
                port: {number: 80}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-api
  namespace: lab4
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: platform-api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-api
  namespace: lab4
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: platform-api}
