apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: lab4
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: platform-api}
  template:
    metadata:
      labels: {app: platform-api}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: lab2-platform:v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: platform-config}
            - secretRef: {name: platform-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: {command: ["/bin/sh", "-c", "sleep 5"]}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: lab4
spec:
  selector: {app: platform-api}
  ports: [{port: 80, targetPort: 8000}]
