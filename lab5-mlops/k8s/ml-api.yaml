apiVersion: apps/v1
kind: Deployment
metadata:
  name: dropout-api
  namespace: lab4
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: dropout-api}
  template:
    metadata:
      labels: {app: dropout-api}
    spec:
      containers:
        - name: api
          image: dropout-api:v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 600m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dropout-api
  namespace: lab4
spec:
  selector: {app: dropout-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dropout-api
  namespace: lab4
spec:
  rules:
    - host: ml.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dropout-api
                port: {number: 8000}
