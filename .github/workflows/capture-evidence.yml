name: Capture laboratory evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pika requests playwright
      - run: docker compose -f lab3-parallel/docker-compose.yml up -d --wait --wait-timeout 180
      - name: Capture actual management UI and PR
        run: python cloud-automation/capture_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: cloud-evidence/
          if-no-files-found: ignore
          retention-days: 3
