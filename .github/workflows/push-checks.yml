name: Logger tests on push
on:
  push:
permissions:
  contents: read
jobs:
  logger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: lab1-git-cicd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run lint
      - run: npm test
